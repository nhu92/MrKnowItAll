[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "sprout-refbuilder"
version = "0.2.2"
description = "Automatic PAFTOL/Kew Angiosperms353 reference builder for SPrOUT"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Nan Hu"}]
dependencies = [
  "biopython>=1.84,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "python-multipart>=0.0.9,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
ml = ["joblib>=1.4,<2", "numpy>=2,<3", "scikit-learn>=1.5,<2"]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7", "ruff>=0.6,<1"]

[project.scripts]
sprout-ref = "sprout_refbuilder.cli:main"
sprout-ref-web = "sprout_refbuilder.web:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sprout_refbuilder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
